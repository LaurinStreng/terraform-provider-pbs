name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Docs up to date
        run: |
          make docs
          git diff --exit-code -- docs/ || (echo "::error::docs/ is outdated, run 'make docs' and commit the result" && exit 1)
          test -z "$(git status --porcelain -- docs/)" || (git status --porcelain -- docs/ && echo "::error::untracked docs, run 'make docs'" && exit 1)

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
